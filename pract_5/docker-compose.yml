# Локальный PostgreSQL вместо neon.tech
services:
  postgres:
    image: postgres:16-alpine
    container_name: rksmpp-pg
    environment:
      POSTGRES_DB: nobel
      POSTGRES_USER: nobel
      POSTGRES_PASSWORD: nobel_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nobel-pg-data:/var/lib/postgresql/data

volumes:
  nobel-pg-data:
