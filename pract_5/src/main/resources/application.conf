ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ ru.mirea.barnatovich.nobelserver.ApplicationKt.module ]
    }
}

jwt {
    # ключ подписи, не короче 32 символов; на сервере задаётся через переменную JWT_SECRET
    secret = "nobel-prize-api-secret-key-barnatovich-2026"
    secret = ${?JWT_SECRET}
    issuer = "nobel-server"
    audience = "nobel-clients"
    realm = "Nobel Prize API"
    expiresMinutes = 30
}

# По умолчанию — локальный PostgreSQL из docker-compose.yml.
# Для neon.tech достаточно задать DATABASE_URL (jdbc:postgresql://<host>/<db>?sslmode=require), DB_USER и DB_PASSWORD.
database {
    url = "jdbc:postgresql://127.0.0.1:55432/nobel"
    url = ${?DATABASE_URL}
    user = "nobel"
    user = ${?DB_USER}
    password = "nobel_dev_password"
    password = ${?DB_PASSWORD}
}
